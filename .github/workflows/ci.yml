name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The deploy workflow runs this one first, so a tag can never ship code that
  # would have failed a pull request.
  workflow_call:

# A new push to the same branch makes the in flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  python:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [sync, engine, reminder-api]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The queue tests run Lua scripts against fakeredis, which needs lupa.
      # Without it the atomic claim path is silently skipped rather than tested.
      - name: Install Lua support for fakeredis
        if: matrix.service == 'reminder-api'
        run: pip install "fakeredis[lua]==2.24.1"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: .
        run: pytest -q

  web:
    name: Web and packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  containers:
    name: Service images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [sync, engine, reminder-api]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. A Dockerfile that stops building is a deploy
      # failure discovered at the worst possible moment otherwise.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: Compose config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config --quiet

  prose:
    name: Copy rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The house style bans em dashes and a short list of filler words in
      # anything a reader sees. Checking it here keeps the rule real rather
      # than aspirational.
      - name: No em dashes
        run: |
          # Written as an escape so this file does not contain the character
          # it is checking for and fail itself.
          dash=$(printf '\xe2\x80\x94')
          if grep -rn --include='*.md' --include='*.py' --include='*.ts' --include='*.tsx' \
               --include='*.yml' --include='*.sql' --include='*.tf' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=venv \
               -- "$dash" . ; then
            echo "Em dash found. Use a comma, a colon, or a full stop."
            exit 1
          fi
          echo "No em dashes found."

      - name: No filler vocabulary
        run: |
          pattern='\b(robust|seamless|seamlessly|leverage|leveraging|cutting.edge|unlock|revolutionize|revolutionise|powerful|comprehensive|streamline|streamlined)\b'
          if grep -rniE --include='*.md' --include='*.py' --include='*.ts' --include='*.tsx' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=venv \
               "$pattern" . ; then
            echo "Filler vocabulary found. Say the specific thing instead."
            exit 1
          fi
          echo "No filler vocabulary found."
